<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Visibility Check Tracker - Secure Login">
  <title>Login &bull; {{ app_name }}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                  #0a0e17;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.25rem;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-brand-icon {
      width: 54px;
      height: 54px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f3f4f6;
      margin: 0 0 0.35rem 0;
      letter-spacing: -0.025em;
    }
    .login-subtitle {
      font-size: 0.875rem;
      color: #9ca3af;
      margin: 0;
    }
    .login-alert {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .login-form .form-group {
      margin-bottom: 1.25rem;
    }
    .login-form .form-label {
      display: block;
      font-size: 0.825rem;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 0.5rem;
    }
    .login-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      color: #f3f4f6;
      font-size: 0.925rem;
      font-family: inherit;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .login-input:focus {
      outline: none;
      border-color: #6366f1;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .btn-login {
      width: 100%;
      padding: 0.9rem 1.25rem;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      margin-top: 1.5rem;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -5px rgba(99, 102, 241, 0.5);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .login-footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #6b7280;
    }
  </style>
</head>
<body class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
      </div>
      <h1 class="login-title">Visibility Tracker</h1>
      <p class="login-subtitle">Sign in with your tracker credentials</p>
    </div>

    {% if error %}
    <div class="login-alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form class="login-form" method="POST" action="/login">
      <div class="form-group">
        <label class="form-label" for="username-input">Username</label>
        <input
          type="text"
          id="username-input"
          name="username"
          class="login-input"
          value="{{ username or '' }}"
          placeholder="e.g. admin"
          required
          autofocus
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password-input">Password</label>
        <input
          type="password"
          id="password-input"
          name="password"
          class="login-input"
          placeholder="••••••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-login" id="btn-login-submit">
        <span>Sign In</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <div class="login-footer">
      <span>Visibility Check Tracker &bull; Local First &bull; Secure Authentication</span>
    </div>
  </div>
</body>
</html>
